name: Vercel - scrapping-saham lint

on:
  repository_dispatch:
    types: [vercel.deployment.ready]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  statuses: write

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: notify vercel
        if: github.event_name == 'repository_dispatch'
        uses: vercel/repository-dispatch/actions/status@v1
        with:
          name: "Vercel - scrapping-saham: lint"
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.git.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run ESLint and TypeScript check
        run: |
          npm run lint
          npx tsc --noEmit
